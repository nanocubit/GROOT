[workspace]
members = ["crates/groot-core", "crates/groot-compat"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["nanocubit"]
rust-version = "1.78"

[workspace.dependencies]
thiserror = "1"

[workspace.features]
# expose groot-core's gitoxide feature as a workspace feature for CI and convenience
gitoxide = ["groot-core/gitoxide"]

[profile.dev]
debug = true

[profile.release]
debug = false
