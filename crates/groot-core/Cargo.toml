[package]
name = "groot-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
gitoxide = ["dep:gix", "dep:gix-discover", "dep:gix-odb", "dep:gix-index"]

[dependencies]
thiserror = "1"

[dependencies.gix]
version = "*"
optional = true

[dependencies.gix-discover]
version = "*"
optional = true

[dependencies.gix-odb]
version = "*"
optional = true

[dependencies.gix-index]
version = "*"
optional = true
